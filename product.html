<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jersey Aficionado</title>
  <meta name="description" content="An authentic football shirt from the Jersey Aficionado collection — honestly described and photographed in detail.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="Jersey Aficionado">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Jersey<span>Aficionado</span></a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="cart.html" class="cart-link">Cart (<span class="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div id="product-root"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> Jersey Aficionado</span>
      <span>jerseyaficionado.com</span>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // Read ?id=... from the URL and show that jersey.
    const id = new URLSearchParams(location.search).get("id");
    const p = findProduct(id);
    const root = document.getElementById("product-root");

    if (!p) {
      root.innerHTML = '<p class="empty">Jersey not found. <a href="shop.html">Back to shop</a>.</p>';
    } else {
      document.title = p.name + " — Jersey Aficionado";

      const imgs = photosOf(p);
      const isPhoto = imgs.length > 0;
      const gallery = `
        <div class="gallery-wrap">
          <div class="gallery ${isPhoto ? "photo" : "placeholder"}"
               ${isPhoto ? "" : `style="${placeholderStyle(p)}"`}>
            ${isPhoto
              ? `<img id="main-photo" src="${imgs[0]}" alt="${p.name}">
                 ${imgs.length > 1 ? `
                   <button class="nav prev" id="nav-prev" aria-label="Previous photo">‹</button>
                   <button class="nav next" id="nav-next" aria-label="Next photo">›</button>` : ""}`
              : `<span>${p.team}</span>`}
          </div>
          ${imgs.length > 1 ? `
            <div class="thumbs">
              ${imgs.map((src, i) => `
                <button class="thumb-btn${i === 0 ? " active" : ""}" data-src="${src}">
                  <img src="${src}" alt="View ${i + 1}" loading="lazy" width="74" height="74">
                </button>`).join("")}
            </div>` : ""}
        </div>`;

      const conditionLine = p.condition
        ? `<div class="condition">✓ ${p.condition}</div>` : "";
      const tierPill = tierLabel(p)
        ? `<div class="pills"><span class="pill ${p.tier === "authentic" ? "pill-auth" : ""}">${tierLabel(p)}</span></div>`
        : "";

      root.innerHTML = `
        <div class="product">
          ${gallery}
          <div class="info">
            <div class="team">${p.team} · ${p.league}</div>
            <h1>${p.name}</h1>
            <div class="price">${formatPrice(p.price)}</div>
            ${tierPill}
            ${conditionLine}
            <p class="desc">${p.description}</p>

            ${p.sizes.length ? '<div class="label">Select size</div>' : ""}
            <div class="sizes" id="sizes">
              ${p.sizes.map(s => `<button class="size-btn">${s}</button>`).join("")}
            </div>

            <button class="btn" id="add">Add to cart</button>
            <button class="btn btn-outline" onclick="location.href='shop.html'">Keep shopping</button>
          </div>
        </div>`;

      // Gallery navigation: thumbnails, click-to-advance, arrows, keyboard
      if (isPhoto && imgs.length > 1) {
        const main = document.getElementById("main-photo");
        const thumbBtns = [...document.querySelectorAll(".thumb-btn")];
        let current = 0;

        function showPhoto(i) {
          current = (i + imgs.length) % imgs.length; // wrap around both ways
          main.src = imgs[current];
          main.style.display = "";
          thumbBtns.forEach((x, idx) => x.classList.toggle("active", idx === current));
        }

        // Click the main image to go to the next photo
        main.style.cursor = "pointer";
        main.addEventListener("click", () => showPhoto(current + 1));

        // ‹ › arrow buttons (stop the click bubbling to the image handler)
        document.getElementById("nav-prev").addEventListener("click", (e) => {
          e.stopPropagation(); showPhoto(current - 1);
        });
        document.getElementById("nav-next").addEventListener("click", (e) => {
          e.stopPropagation(); showPhoto(current + 1);
        });

        // Click a specific thumbnail
        document.querySelector(".thumbs").addEventListener("click", (e) => {
          const b = e.target.closest(".thumb-btn");
          if (b) showPhoto(thumbBtns.indexOf(b));
        });

        // Keyboard left/right arrows
        document.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight") showPhoto(current + 1);
          else if (e.key === "ArrowLeft") showPhoto(current - 1);
        });
      }

      // Size selection
      let chosenSize = null;
      document.getElementById("sizes").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        document.querySelectorAll("#sizes .size-btn").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        chosenSize = b.textContent;
      });

      // Add to cart
      const addBtn = document.getElementById("add");
      addBtn.addEventListener("click", () => {
        if (p.sizes.length && !chosenSize) { alert("Please pick a size first."); return; }
        if (p.price === null || p.price === undefined) {
          alert("This item is priced on request — please use the Contact page to buy.");
          return;
        }
        addToCart({
          id: p.id, name: p.name, size: chosenSize,
          price: p.price, photo: photosOf(p)[0], stock: p.stock
        });
        // brief inline confirmation instead of a popup
        const original = addBtn.textContent;
        addBtn.textContent = "Added to cart ✓";
        addBtn.classList.add("added");
        setTimeout(() => { addBtn.textContent = original; addBtn.classList.remove("added"); }, 1500);
      });
    }

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
